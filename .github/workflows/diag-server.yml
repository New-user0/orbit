name: diag-server

# Temporary: measures each Windows server test's time under three orderings, to find why rows time out. Removed after.
on:
  pull_request:

jobs:
  diag:
    name: diag server (${{ matrix.order }} ${{ matrix.n }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        order: [basecode, prexact]
        n: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.order == 'basecode' && 'm5-integration' || '' }}
      - uses: ./.github/actions/setup-bun
      - name: Configure git
        run: git config --global core.autocrlf false
      - name: Use the long name of the temp folder
        shell: bash
        run: |
          long="$(cygpath -w -l "$TEMP")"
          echo "TEMP=$long" >> "$GITHUB_ENV"
          echo "TMP=$long" >> "$GITHUB_ENV"
      - name: Use Git Bash as the session shell
        shell: bash
        run: echo "SHELL=$(cygpath -m "$(command -v bash)")" >> "$GITHUB_ENV"
      - name: Install ripgrep
        shell: bash
        run: |
          choco install ripgrep --yes --no-progress
          real="$(find /c/ProgramData/chocolatey/lib/ripgrep -name rg.exe | head -n1)"
          cygpath -w "$(dirname "$real")" >> "$GITHUB_PATH"
      - name: Test
        working-directory: packages/server
        shell: bash
        run: |
          nproc || true
          git log --oneline -1
          bun run test --update-timings --coverage --coverage-reporter=lcov --coverage-dir=coverage --reporter=junit "--reporter-outfile=$RUNNER_TEMP/junit.xml" 2>&1 | tee "$RUNNER_TEMP/test.log" | grep -E '^\(fail\)|Ran |PARALLEL' || true
      - name: Upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ matrix.order }}-${{ matrix.n }}
          path: |
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/test.log
          retention-days: 3
