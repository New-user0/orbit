name: check

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: brand gate, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Brand gate
        run: bun tools/rebrand/rebrand.ts --check
      - name: Lint and typecheck
        run: bun run check

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ai, cli, client, codemode, core, flow, plugin, protocol, schema, server, tui, util, vscode]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      # Orbit does not download ripgrep; the search tools and their tests use the one on PATH.
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Test
        working-directory: packages/${{ matrix.package }}
        # cli includes the egress test: an idle server must make no outbound connection for two minutes.
        env:
          ORBIT_EGRESS_IDLE_MS: "120000"
        # Each package's own test script, which sets up what its tests need (core's isolates home and config).
        # The log ends with the failing tests' names, which the full output buries.
        shell: bash
        run: |
          set -o pipefail
          bun run test 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            echo "::group::Failures"
            grep -E '^\(fail\)|^error:|Unhandled error' "$RUNNER_TEMP/test.log" | tail -60
            echo "::endgroup::"
            exit 1
          }

  windows:
    name: test on Windows (flow)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      # The tests compare file contents byte for byte, so checkouts keep the line endings agents wrote.
      - name: Configure git
        run: git config --global core.autocrlf false
      - name: Flow package
        working-directory: packages/flow
        run: bun test
      - name: orb flow and the workflow tool end to end
        working-directory: packages/cli
        run: bun test --timeout 60000 test/flow.test.ts test/flow-verify.test.ts test/flow-team.test.ts test/workflow-tool.test.ts

  artifact:
    name: build and scan binary and extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Build single binary
        working-directory: packages/cli
        run: bun run build --single
      - name: Scan build output for upstream brand and the notice file
        run: bun tools/rebrand/rebrand.ts --scan packages/cli/dist
      - name: Package VS Code extension
        working-directory: packages/vscode
        run: bun run package
      - name: Scan the extension package for upstream brand and the notice file
        run: |
          unzip -q packages/vscode/dist/orbit-code-*.vsix -d packages/vscode/dist/vsix
          bun tools/rebrand/rebrand.ts --scan packages/vscode/dist/vsix
