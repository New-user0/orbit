name: check

on:
  # A pull request's branch is checked by its pull_request run alone; running push too doubled every run.
  push:
    branches: [main, "m*-integration"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: brand gate, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Brand gate
        run: bun tools/rebrand/rebrand.ts --check
      - name: Vendor branding gate
        run: bun tools/rebrand/vendor.ts --check
      - name: Lint and typecheck
        run: bun run check

  generated:
    name: generated OpenAPI document and client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      # Both checks fail when the committed output differs from what the current Protocol generates. The fix is
      # `bun run generate` in packages/protocol and then in packages/client, committing what they change.
      - name: OpenAPI document
        id: openapi
        working-directory: packages/protocol
        run: |
          bun run check:generated || {
            echo "::error title=Generated OpenAPI document check failed::Run 'bun run generate' in packages/protocol and commit what it changes. If the log shows the generator crashing, fix that first."
            exit 1
          }
      # The client check regenerates in place and diffs against the checkout. It runs even when the OpenAPI check
      # failed, because a stale Protocol change is usually stale in both places and one run should say so. It is
      # skipped when checkout or setup failed: the check could not run then, so its failure would say nothing about
      # the committed output.
      - name: Generated client
        if: ${{ !cancelled() && steps.openapi.outcome != 'skipped' }}
        working-directory: packages/client
        run: |
          bun run check:generated || {
            echo "::error title=Generated client check failed::Run 'bun run generate' in packages/client and commit what it changes. If the log shows the generator crashing, fix that first."
            exit 1
          }

  test:
    name: test (${{ matrix.package }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    # In the parallel packages (core, cli, tui, server, vscode) a stuck test file fails the run within its deadline
    # (tools/test/watchdog.ts, ten minutes by default). A serial package's run has no watchdog, so a stuck file there
    # holds the job until this limit.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # sdk holds the contract-identity tests (SDK, Core, Server and Client must share one set of contracts);
        # theme holds the theme resolution tests; compat holds the compatibility switch and root discovery tests;
        # http-recorder holds the cassette store, whose append waits for a reader of the cassette on Windows.
        # cli runs as three jobs. `bun test --shard` splits a package's files by the Linux timings it keeps
        # (test/timings.json); `part` names the shard's coverage and timings artifacts. The sharded jobs are listed
        # first, because GitHub starts jobs in this order when the concurrency limit queues some.
        include:
          - { package: cli, shard: "1/3", part: "-1of3" }
          - { package: cli, shard: "2/3", part: "-2of3" }
          - { package: cli, shard: "3/3", part: "-3of3" }
          - { package: core }
          - { package: tui }
          - { package: server }
          - { package: vscode }
          - { package: flow }
          - { package: ai }
          - { package: client }
          - { package: codemode }
          - { package: compat }
          - { package: plugin }
          - { package: protocol }
          - { package: schema }
          - { package: sdk }
          - { package: theme }
          - { package: util }
          - { package: http-recorder }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      # Orbit does not download ripgrep; the search tools and their tests use the one on PATH.
      - name: Install ripgrep
        # A mirror that answers an error is retried with a growing pause before the job fails. The update's exit code is
        # not what decides: a third-party list of the image that fails (packages.microsoft.com answered 403 in run
        # 45956226249) fails the whole update though Ubuntu's own lists, which hold ripgrep, were read.
        run: |
          for attempt in 1 2 3 4 5; do
            sudo apt-get update -o Acquire::Retries=3 || echo "apt-get update reported an error; installing from the lists it read" >&2
            sudo apt-get install -y -o Acquire::Retries=3 ripgrep && exit 0
            echo "ripgrep install attempt $attempt failed, retrying in $((attempt * 10)) s" >&2
            sleep $((attempt * 10))
          done
          exit 1
      - name: Test
        working-directory: packages/${{ matrix.package }}
        # cli includes the egress test: an idle server must make no outbound connection for two minutes.
        env:
          ORBIT_EGRESS_IDLE_MS: "120000"
          SHARD: ${{ matrix.shard }}
        # Each package's own test script, which sets up what its tests need (core's isolates home and config).
        # The log ends with the failing tests' names, which the full output buries.
        # The run also writes line coverage, which the changed-line coverage gate reads from the artifact below.
        shell: bash
        run: |
          set -o pipefail
          bun run test ${SHARD:+--shard=$SHARD} --update-timings --coverage --coverage-reporter=lcov --coverage-dir=coverage --reporter=junit --reporter-outfile=junit.xml 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            echo "::group::Failures"
            grep -E '^\(fail\)|^error:|Unhandled error|^Test file stuck' "$RUNNER_TEMP/test.log" | tail -60
            echo "::endgroup::"
            exit 1
          }
      # Uploaded even when tests fail: a failure on a known row still leaves the coverage the gate needs.
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov-linux-${{ matrix.package }}${{ matrix.part }}
          path: packages/${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      # Each test's own time (bun's JUnit report), from which a measured limit is set: at least twice the worst time the
      # row took on a loaded runner (AGENTS.md, Testing).
      - name: Upload test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-linux-${{ matrix.package }}${{ matrix.part }}
          path: packages/${{ matrix.package }}/junit.xml
          if-no-files-found: warn
          retention-days: 14
      # What each job measured (`--update-timings`). `bun tools/test/timings.ts --run <id>` merges a run's artifacts into
      # the committed timings files. A package that runs serially writes none, and a run that was stopped writes none, so
      # its unchanged copy of the committed file is not uploaded.
      - name: Check timings
        id: timings
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          file="packages/${{ matrix.package }}/test/timings.json"
          if [ -f "$file" ] && [ -n "$(git status --porcelain -- "$file")" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Upload timings
        if: ${{ !cancelled() && steps.timings.outputs.changed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timings-linux-${{ matrix.package }}${{ matrix.part }}
          path: packages/${{ matrix.package }}/test/timings.json
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: test on Windows (${{ matrix.package }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: windows-latest
    # Windows runners are slower than Linux ones. As on Linux, only the parallel packages' runs stop a stuck file at its
    # deadline; a serial package's run ends at this limit.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # cli, core and tui run as six, three and two jobs. `bun test --shard` splits a package's files by the Windows
        # timings it keeps (test/timings.windows.json); `part` names the shard's coverage and timings artifacts. As on
        # Linux, the sharded jobs come first so that GitHub starts them before the short ones.
        include:
          - { package: cli, shard: "1/6", part: "-1of6" }
          - { package: cli, shard: "2/6", part: "-2of6" }
          - { package: cli, shard: "3/6", part: "-3of6" }
          - { package: cli, shard: "4/6", part: "-4of6" }
          - { package: cli, shard: "5/6", part: "-5of6" }
          - { package: cli, shard: "6/6", part: "-6of6" }
          - { package: core, shard: "1/3", part: "-1of3" }
          - { package: core, shard: "2/3", part: "-2of3" }
          - { package: core, shard: "3/3", part: "-3of3" }
          - { package: tui, shard: "1/2", part: "-1of2" }
          - { package: tui, shard: "2/2", part: "-2of2" }
          - { package: server }
          - { package: vscode }
          - { package: flow }
          - { package: ai }
          - { package: client }
          - { package: codemode }
          - { package: compat }
          - { package: plugin }
          - { package: protocol }
          - { package: schema }
          - { package: sdk }
          - { package: theme }
          - { package: util }
          - { package: http-recorder }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      # The tests compare file contents byte for byte, so checkouts keep the line endings agents wrote.
      - name: Configure git
        run: git config --global core.autocrlf false
      # The runner's TEMP is an 8.3 short name (C:\Users\RUNNER~1\...). Tests compare the folders they make under it
      # with the real paths Orbit resolves, which use the long name, as TEMP does on a developer's machine.
      - name: Use the long name of the temp folder
        shell: bash
        run: |
          long="$(cygpath -w -l "$TEMP")"
          echo "TEMP=$long" >> "$GITHUB_ENV"
          echo "TMP=$long" >> "$GITHUB_ENV"
          echo "$long"
      # Git Bash exports SHELL when a developer opens it, and Orbit's session shell on Windows follows SHELL; without it
      # the session shell is PowerShell and the tests' scripted Bash calls find no Bash tool. The runner's bash steps do
      # not export it, so it is set to Git Bash here.
      - name: Use Git Bash as the session shell
        shell: bash
        run: |
          shell="$(cygpath -m "$(command -v bash)")"
          echo "SHELL=$shell" >> "$GITHUB_ENV"
          echo "$shell"
      # The Windows image has no ripgrep, and the search tools and their tests use the one on PATH. The step downloads a
      # pinned release from GitHub (Chocolatey's feed answered 503 and failed 18 jobs at once) and checks its SHA-256
      # against the value pinned here, which is the release's published .sha256. The folder is cached between runs and
      # the download retries with a growing pause. The folder holds the real rg.exe, not a shim, which a test may copy
      # into another folder. Printing the version fails the step when the program is missing.
      - name: Cache ripgrep
        id: ripgrep-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/ripgrep
          key: ripgrep-14.1.1-windows-x64-d0f53402
      - name: Install ripgrep
        if: steps.ripgrep-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          RG_VERSION: "14.1.1"
          RG_SHA256: d0f534024c42afd6cb4d38907c25cd2b249b79bbe6cc1dbee8e3e37c2b6e25a1
        run: |
          set -eu
          name="ripgrep-$RG_VERSION-x86_64-pc-windows-msvc"
          zip="$RUNNER_TEMP/$name.zip"
          for attempt in 1 2 3 4 5 6; do
            if curl --silent --show-error --fail --location --connect-timeout 20 --max-time 120 \
              --output "$zip" "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/$name.zip" \
              && echo "$RG_SHA256 *$zip" | sha256sum --check --status; then
              break
            fi
            test "$attempt" -lt 6 || { echo "ripgrep download failed after $attempt attempts" >&2; exit 1; }
            echo "ripgrep download attempt $attempt failed, retrying in $((attempt * 10)) s" >&2
            sleep $((attempt * 10))
          done
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$zip")' -DestinationPath '$(cygpath -w "$RUNNER_TEMP/ripgrep-unpacked")' -Force"
          mkdir -p "$RUNNER_TEMP/ripgrep"
          cp "$RUNNER_TEMP/ripgrep-unpacked/$name/rg.exe" "$RUNNER_TEMP/ripgrep/rg.exe"
      - name: Put ripgrep on PATH
        shell: bash
        run: |
          cygpath -w "$RUNNER_TEMP/ripgrep" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ripgrep/rg.exe" --version
      # The full suite, as on Linux: Windows semantics (path.win32, .exe heads, UNC paths, junctions, program lookup in
      # the working folder) are only exercised here. Git Bash runs it, as the core tests expect.
      - name: Test
        working-directory: packages/${{ matrix.package }}
        env:
          ORBIT_EGRESS_IDLE_MS: "120000"
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -o pipefail
          bun run test ${SHARD:+--shard=$SHARD} --update-timings --coverage --coverage-reporter=lcov --coverage-dir=coverage --reporter=junit --reporter-outfile=junit.xml 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            echo "::group::Failures"
            grep -E '^\(fail\)|^error:|Unhandled error|^Test file stuck' "$RUNNER_TEMP/test.log" | tail -60
            echo "::endgroup::"
            exit 1
          }
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov-windows-${{ matrix.package }}${{ matrix.part }}
          path: packages/${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
      # Each test's own time (bun's JUnit report), from which a measured limit is set: at least twice the worst time the
      # row took on a loaded runner (AGENTS.md, Testing).
      - name: Upload test durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-windows-${{ matrix.package }}${{ matrix.part }}
          path: packages/${{ matrix.package }}/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Check timings
        id: timings
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          file="packages/${{ matrix.package }}/test/timings.windows.json"
          if [ -f "$file" ] && [ -n "$(git status --porcelain -- "$file")" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Upload timings
        if: ${{ !cancelled() && steps.timings.outputs.changed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: timings-windows-${{ matrix.package }}${{ matrix.part }}
          path: packages/${{ matrix.package }}/test/timings.windows.json
          if-no-files-found: ignore
          retention-days: 14

  artifact:
    name: build and scan binary and extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Build single binary
        working-directory: packages/cli
        run: bun run build --single
      - name: Scan build output for upstream brand and the notice file
        run: bun tools/rebrand/rebrand.ts --scan packages/cli/dist
      - name: Package VS Code extension
        working-directory: packages/vscode
        run: bun run package
      - name: Scan the extension package for upstream brand and the notice file
        run: |
          unzip -q packages/vscode/dist/orbit-code-*.vsix -d packages/vscode/dist/vsix
          bun tools/rebrand/rebrand.ts --scan packages/vscode/dist/vsix
