name: check

on:
  # A pull request's branch is checked by its pull_request run alone; running push too doubled every run.
  push:
    branches: [main, "m*-integration"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: brand gate, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Brand gate
        run: bun tools/rebrand/rebrand.ts --check
      - name: Vendor branding gate
        run: bun tools/rebrand/vendor.ts --check
      - name: Lint and typecheck
        run: bun run check

  generated:
    name: generated OpenAPI document and client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      # Both checks fail when the committed output differs from what the current Protocol generates. The fix is
      # `bun run generate` in packages/protocol and then in packages/client, committing what they change.
      - name: OpenAPI document
        id: openapi
        working-directory: packages/protocol
        run: |
          bun run check:generated || {
            echo "::error title=Generated OpenAPI document check failed::Run 'bun run generate' in packages/protocol and commit what it changes. If the log shows the generator crashing, fix that first."
            exit 1
          }
      # The client check regenerates in place and diffs against the checkout. It runs even when the OpenAPI check
      # failed, because a stale Protocol change is usually stale in both places and one run should say so. It is
      # skipped when checkout or setup failed: the check could not run then, so its failure would say nothing about
      # the committed output.
      - name: Generated client
        if: ${{ !cancelled() && steps.openapi.outcome != 'skipped' }}
        working-directory: packages/client
        run: |
          bun run check:generated || {
            echo "::error title=Generated client check failed::Run 'bun run generate' in packages/client and commit what it changes. If the log shows the generator crashing, fix that first."
            exit 1
          }

  test:
    name: test (${{ matrix.package }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    # A stopped or hung worker must fail the job instead of holding it for hours.
    # The cli job took 29.7 min on 2 CPUs in Docker, and CI runners are 1.25x to 1.5x slower; 90 leaves headroom.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # sdk holds the contract-identity tests (SDK, Core, Server and Client must share one set of contracts);
        # theme holds the theme resolution tests; compat holds the compatibility switch and root discovery tests.
        package: [ai, client, codemode, compat, core, flow, plugin, protocol, schema, sdk, server, theme, tui, util, vscode]
        # cli is the longest suite (about 34 min), so it runs as two jobs. `bun test --shard` splits the files by the
        # package's committed test/timings.json; `part` names the shard's coverage artifact.
        include:
          - { package: cli, shard: "1/2", part: "-1of2" }
          - { package: cli, shard: "2/2", part: "-2of2" }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      # Orbit does not download ripgrep; the search tools and their tests use the one on PATH.
      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep
      - name: Test
        working-directory: packages/${{ matrix.package }}
        # cli includes the egress test: an idle server must make no outbound connection for two minutes.
        env:
          ORBIT_EGRESS_IDLE_MS: "120000"
          SHARD: ${{ matrix.shard }}
        # Each package's own test script, which sets up what its tests need (core's isolates home and config).
        # The log ends with the failing tests' names, which the full output buries.
        # The run also writes line coverage, which the changed-line coverage gate reads from the artifact below.
        shell: bash
        run: |
          set -o pipefail
          bun run test ${SHARD:+--shard=$SHARD} --coverage --coverage-reporter=lcov --coverage-dir=coverage 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            echo "::group::Failures"
            grep -E '^\(fail\)|^error:|Unhandled error' "$RUNNER_TEMP/test.log" | tail -60
            echo "::endgroup::"
            exit 1
          }
      # Uploaded even when tests fail: a failure on a known row still leaves the coverage the gate needs.
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov-linux-${{ matrix.package }}${{ matrix.part }}
          path: packages/${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: test on Windows (${{ matrix.package }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: windows-latest
    # Windows runners are slower than Linux ones, and core and cli are the longest suites there.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        package: [ai, client, codemode, compat, flow, plugin, protocol, schema, sdk, server, theme, tui, util, vscode]
        # cli (about 52 min) and core (about 25 min) set the length of every run, so they run as three and two jobs.
        # `bun test --shard` splits the files by the package's committed test/timings.json; `part` names the shard's
        # coverage artifact.
        include:
          - { package: cli, shard: "1/3", part: "-1of3" }
          - { package: cli, shard: "2/3", part: "-2of3" }
          - { package: cli, shard: "3/3", part: "-3of3" }
          - { package: core, shard: "1/2", part: "-1of2" }
          - { package: core, shard: "2/2", part: "-2of2" }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      # The tests compare file contents byte for byte, so checkouts keep the line endings agents wrote.
      - name: Configure git
        run: git config --global core.autocrlf false
      # The runner's TEMP is an 8.3 short name (C:\Users\RUNNER~1\...). Tests compare the folders they make under it
      # with the real paths Orbit resolves, which use the long name, as TEMP does on a developer's machine.
      - name: Use the long name of the temp folder
        shell: bash
        run: |
          long="$(cygpath -w -l "$TEMP")"
          echo "TEMP=$long" >> "$GITHUB_ENV"
          echo "TMP=$long" >> "$GITHUB_ENV"
          echo "$long"
      # Git Bash exports SHELL when a developer opens it, and Orbit's session shell on Windows follows SHELL; without it
      # the session shell is PowerShell and the tests' scripted Bash calls find no Bash tool. The runner's bash steps do
      # not export it, so it is set to Git Bash here.
      - name: Use Git Bash as the session shell
        shell: bash
        run: |
          shell="$(cygpath -m "$(command -v bash)")"
          echo "SHELL=$shell" >> "$GITHUB_ENV"
          echo "$shell"
      # The Windows image has no ripgrep, and the search tools and their tests use the one on PATH. Chocolatey's bin
      # folder holds only a shim, which stops working once a test copies it into another folder, so the folder of the
      # real rg.exe goes first on PATH. Printing the version fails the step when it is missing.
      - name: Install ripgrep
        shell: bash
        run: |
          choco install ripgrep --yes --no-progress
          real="$(find /c/ProgramData/chocolatey/lib/ripgrep -name rg.exe | head -n1)"
          test -n "$real"
          cygpath -w "$(dirname "$real")" >> "$GITHUB_PATH"
          "$real" --version
      # The full suite, as on Linux: Windows semantics (path.win32, .exe heads, UNC paths, junctions, program lookup in
      # the working folder) are only exercised here. Git Bash runs it, as the core tests expect.
      - name: Test
        working-directory: packages/${{ matrix.package }}
        env:
          ORBIT_EGRESS_IDLE_MS: "120000"
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -o pipefail
          bun run test ${SHARD:+--shard=$SHARD} --coverage --coverage-reporter=lcov --coverage-dir=coverage 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            echo "::group::Failures"
            grep -E '^\(fail\)|^error:|Unhandled error' "$RUNNER_TEMP/test.log" | tail -60
            echo "::endgroup::"
            exit 1
          }
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lcov-windows-${{ matrix.package }}${{ matrix.part }}
          path: packages/${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  artifact:
    name: build and scan binary and extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-bun
      - name: Build single binary
        working-directory: packages/cli
        run: bun run build --single
      - name: Scan build output for upstream brand and the notice file
        run: bun tools/rebrand/rebrand.ts --scan packages/cli/dist
      - name: Package VS Code extension
        working-directory: packages/vscode
        run: bun run package
      - name: Scan the extension package for upstream brand and the notice file
        run: |
          unzip -q packages/vscode/dist/orbit-code-*.vsix -d packages/vscode/dist/vsix
          bun tools/rebrand/rebrand.ts --scan packages/vscode/dist/vsix
